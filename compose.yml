services:
  mediamtx:
    # Pinned: an unpinned image silently upgrades MediaMTX on every
    # `docker compose pull`, and releases rename config keys.
    image: bluenviron/mediamtx:1.21.3
    container_name: mediamtx
    ports:
      - "1935:1935" #RTMP
      - "8888:8888" #HLS
      - "9997:9997" #API
      - "8554:8554" #RTSP (TCP only — see rtspTransports in mediamtx.yml)
      - "8889:8889" #WEBRTC signaling
      - "8189:8189/udp" #WEBRTC media (UDP; without this WebRTC cannot play)
      - "8890:8890/udp" #SRT (UDP — a plain "8890:8890" publishes TCP and SRT never connects)
    volumes:
      - '${USERPROFILE}\Videos\Livestream:/recordings/live'
      - ./mediamtx.yml:/mediamtx.yml
    restart: unless-stopped
